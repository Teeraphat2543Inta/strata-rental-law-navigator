[project]
name = "strata-rental-law-navigator"
version = "1.0.0"
description = "Which housing rules apply at this address today, and what is about to change? Every answer quotes the law."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Teeraphat Inta" }]
requires-python = ">=3.9"
dependencies = []          # standard library only

[project.optional-dependencies]
schema = ["jsonschema>=4"]  # strict JSON Schema validation in `run.py check`
video = ["playwright>=1.40"]

[tool.ruff]
line-length = 120
target-version = "py39"
